name: Build Glance Auto Beta APK
on:
  push:
    paths:
      - 'Glance-Auto-Beta-v1.1/**'
      - '.github/workflows/build-glance-auto.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Run Java regression suite
        run: bash Glance-Auto-Beta-v1.1/qa/run-stress.sh
      - name: Build debug APK
        run: gradle --no-daemon -p Glance-Auto-Beta-v1.1 :app:assembleDebug
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: APPLLP7-Glance-Auto-Beta-v1.1-debug-APK
          path: Glance-Auto-Beta-v1.1/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
